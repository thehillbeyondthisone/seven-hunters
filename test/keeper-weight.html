<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keeper weight · development review</title>
<link rel="stylesheet" href="/src/ui/ui.css"><link rel="stylesheet" href="/src/story/story.css">
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10191d}canvas{display:block}#begin-review{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:106;padding:10px 18px;border:1px solid #c6b99c;background:#10191dcc;color:#eee4cf;font:14px system-ui}#review-note{position:fixed;bottom:12px;left:12px;z-index:105;max-width:310px;padding:8px 12px;background:#10191dcc;color:#eee4cf;font:12px/1.5 system-ui;pointer-events:none}</style></head><body>
<div id="app"></div>
<div id="fps" hidden></div>
<button id="begin-review" hidden>Release the fully wound stop</button>
<p id="review-note">Development review · the burner is lit and the weight fully raised. Release the stop for the mechanical cutscene, examine the settled light, then wind again. This page writes no watch saves.</p>
<script type="module">
import { App } from '../src/App.js';
import { UI } from '../src/ui/UI.js';
import { AppUI } from '../src/ui/AppUI.js';
import { Story } from '../src/story/Story.js';
import { TOWER } from '../src/world/flannan/Station.js';
import { SUNSET } from '../src/story/Script.js';
const app = new App(), ui = new UI(); window.__ui = ui;
app.qs.set('keeperPreview',''); app.qs.set('noAudio','');
// Like the benchmark, this review must be able to compile in a background tab.
const raf = window.requestAnimationFrame.bind(window), caf = window.cancelAnimationFrame.bind(window);
window.requestAnimationFrame = cb => document.visibilityState === 'hidden' ? setTimeout(()=>cb(performance.now()),16) : raf(cb);
window.cancelAnimationFrame = id => { clearTimeout(id); caf(id); };
const note = document.getElementById('review-note'), readyText = note.textContent;
await app.init((p,label,until)=>{ui.setLoading(p,label,until); note.textContent=`Loading weight review · ${label}`;});
app.ui = new AppUI(app,ui);
const s = app.story = new Story(app); s.save = ()=>{};
s.h = SUNSET + .2; s.beat = 'machine'; s.paused = true;
s.flags = {landed:true,islandRevealSeen:true,keeperDuty:{inspected:true,verified:false},introLessons:{seen:[],pending:[],active:null,gap:0,yard:true,done:true}};
s.arrival.group.visible = false;
s.hand.carried = s.hand.lit = true; s.hand.glow = 1;
s.lamp.wind = 1; s.lamp.stop(); s.lamp.ignite(); s.lamp.glow = 1; s.lamp.speed = 0;
s.keeper.drive.sync(s.lamp.wind);
const at = s.keeper.at, p = app.player;
p.position.set(Math.cos(TOWER.crankAngle)*1.95,TOWER.deck,Math.sin(TOWER.crankAngle)*1.95); p.mode='walk'; p.grounded=true; p.velocity.set(0,0,0);
p.yaw=Math.atan2(p.position.x-at.x,p.position.z-at.z); p.pitch=Math.atan2(at.y-TOWER.deck-1.62,p.position.distanceTo(at)); p._camY=null; p.update(0);
s._applyClock(); app.cameraCut();
await ui.hideLoader();
app.devMenu = new (await import('../src/dev/DebugMenu.js')).DebugMenu(app);
app.start();
note.textContent = readyText;
const begin = document.getElementById('begin-review'); begin.hidden = false;
begin.onclick = ()=>{s.paused=false; begin.remove(); note.hidden=true; s.keeper.toggleStop();};
const still = { 'weight-start':1, 'weight-end':7, optic:10 }[app.qs.get('still')];
if (still) {
 begin.onclick();
 for(let i=0;i<still*60;i++)s.update(1/60);
 s.paused=true;
}
</script></body></html>
