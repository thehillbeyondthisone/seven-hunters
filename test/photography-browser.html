<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brownie · rendered-frame acceptance</title>
<link rel="stylesheet" href="/src/ui/ui.css"><link rel="stylesheet" href="/src/story/story.css"><style>#camera-check{position:fixed;z-index:105;left:16px;bottom:16px;padding:12px;background:#14212bdd;color:#f2ead7;font:16px/1.4 system-ui}button{font:inherit;padding:10px}#camera-check:has(+.nothing){display:none}</style></head><body><div id="app"></div><div id="fps" hidden></div><div id="camera-check"><p id="status">Loading…</p><button id="run" hidden>Capture three rendered photographs</button><p id="errors"></p></div>
<script type="module">
import{App}from'../src/App.js';import{UI}from'../src/ui/UI.js';import{AppUI}from'../src/ui/AppUI.js';import{Story}from'../src/story/Story.js';import{GPU}from'../src/engine/gpu/GPU.js';import{Vector3}from'../src/engine/index.js';
const app=new App(),ui=new UI(),status=document.querySelector('#status'),run=document.querySelector('#run');await app.init((p,label,until)=>{status.textContent=label;ui.setLoading(p,label,until);});app.ui=new AppUI(app,ui);const s=app.story=new Story(app);s.save=()=>{};s.paused=false;s.h=228;s.beat='lw-photos';s.flags.landed=true;s.flags.unpacking={stage:4,examined:true};s.photography.state.taken=true;s.photography.raised=true;s.unpacking.sync();s.hand.carried=true;s.hand.lit=false;s._applyClock();app.input.requestLock=()=>{};GPU.device.addEventListener('uncapturederror',e=>{document.querySelector('#errors').textContent+=e.error.message;});app.start();await ui.hideLoader();run.hidden=false;status.textContent='A renderer check only. No saves or authored story progress.';
const frame=()=>new Promise(requestAnimationFrame);
run.onclick=async()=>{run.hidden=true;for(const site of s.photography.sites){app.player.position.copy(site.stand);app.camera.position.copy(site.stand).add(new Vector3(0,1.62,0));app.camera.lookAt(site.at);const d=site.at.clone().sub(app.camera.position).normalize();app.player.yaw=Math.atan2(-d.x,-d.z);app.player.pitch=Math.asin(d.y);app.cameraCut();app.post.autoExposure.snap.value=1;for(let i=0;i<20;i++)await frame();if(site.id==='chair'&&s.photography.tutorialPending){s.interact.get('photo-brace').use();s.photography.ready();}if(!s.photography.expose(site))throw Error('Exposure unavailable');while(s.photography.capturing)await frame();s.interact.get('filmWind').use();}
status.textContent=`PASS · ${s.photography.state.frames.length} actual rendered photographs. No GPU errors: ${!document.querySelector('#errors').textContent}`;await s.ui.album({title:'The Brownie prints',intro:'The chair, the apparatus, the small foothold above the sea. Actual exposed views from the game renderer.',frames:s.photography.state.frames});};
</script></body></html>
