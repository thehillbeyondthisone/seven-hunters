<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Station joinery review</title>
<style>html,body{margin:0;overflow:hidden;background:#141b20}canvas{display:block}#fps{display:none}nav{position:fixed;bottom:12px;left:12px;right:12px;background:#141b20ef;color:#eee4cf;padding:12px;font:14px/1.5 system-ui;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:7px}#state{min-width:240px}#message{position:fixed;top:12px;left:12px;color:#eee4cf;background:#141b20db;padding:8px;font:13px system-ui}</style>
<div id="app"></div><div id="fps"></div><div id="message">Loading actual station renderer…</div>
<nav><span id="state">Loading…</span><label>View <select id="view" disabled></select></label><button id="door" disabled>Open doors</button><button id="night" disabled>Night with lantern</button><button id="save" disabled>Save review frame</button></nav>
<script type="module">
import { App } from '../src/App.js';
import { Vector3 } from '../src/engine/index.js';
import { updateDoor, TOWER } from '../src/world/flannan/Station.js';
import { GPU } from '../src/engine/gpu/GPU.js';
import { Texture } from '../src/engine/gpu/Texture.js';
import { readTexture } from '../src/engine/gpu/Readback.js';
const app = new App(), state=document.getElementById('state'), message=document.getElementById('message');
const selector=document.getElementById('view'), door=document.getElementById('door'), night=document.getElementById('night'), save=document.getElementById('save');
app.qs.set('noAudio',''); app.qs.set('morningPreview','');
await app.init((p,label)=>{state.textContent=label || `${Math.round(p*100)}%`});
app.ui={ui:{photoMode:false,toast(){}},update(){}};
app.settings.timeSpeed=0; app.post.autoExposure.snap.value=1;
app.setFreeCam(true);
const views={
 lantern:{label:'Hero lantern close view',p:[-4.57,82.04,3.59],at:[-4.95,81.95,3.12],doors:[],fov:42,lampRest:true},
 lanternBack:{label:'Hero lantern reverse',p:[-5.4,82.07,2.72],at:[-4.95,81.95,3.12],doors:[],fov:42,lampRest:true},
 room:{label:'Keepers room overview',p:[-.7,82.55,4.35],at:[-6.2,82.10,1.75],doors:[],fov:68},
 desk:{label:'Desk and journal',p:[-5.9,82.48,.42],at:[-6.45,81.99,-.78],doors:[],fov:55},
 table:{label:'Table and chairs',p:[-3.9,82.65,4.65],at:[-5.4,81.8,3.3],doors:[],fov:55},
 dresser:{label:'Dresser and crockery',p:[-6,82.4,1.2],at:[-8.64,82.29,.45],doors:[],fov:55},
 stove:{label:'Stove and kettle',p:[-6.9,82.12,4.1],at:[-8.52,81.73,3.9],doors:[],fov:52},
 oilskins:{label:'Oilskins and entrance',p:[-1.1,82.4,3.25],at:[1.03,82.35,3.25],doors:[],fov:55},
 kitchen:{label:'Kitchen door',p:[-3.1,82.42,3.6],at:[-2.2,82.08,5.7],doors:['kitchen'],fov:62},
 kitchenBack:{label:'Kitchen reverse and lining',p:[-.65,82.42,7.5],at:[-2.2,82.05,5.7],doors:['kitchen'],fov:62},
 berth:{label:'Berth door',p:[-3.3,82.42,8.55],at:[-2.2,82.08,10.65],doors:['berth'],fov:62},
 gate:{label:'East gate hardware',p:[16.35,82.2,6.6],at:[12.75,81.44,6],doors:['gate'],fov:62},
 entrance:{label:'House entrance and steps',p:[5.3,82.38,5.65],at:[1.68,81.65,4.6],doors:['house'],fov:57},
 stair:{label:'Tower stair and handrail',p:[-.1,87,-1.25],at:[1.2,87.9,.3],doors:[],fov:72},
 junction:{label:'Tower threshold and wall junction',p:[-2.6,82.5,2.4],at:[-.5,81.9,.5],doors:[],fov:70},
 gallery:{label:'Gallery door fittings',p:[.15,99.75,-.35],at:[Math.cos(TOWER.galleryDoor)*2.32,99.18,Math.sin(TOWER.galleryDoor)*2.32],doors:['gallery'],fov:65},
 store:{label:'Oil-store working door',p:[9.8,82.2,1.6],at:[9.3,81.8,-.58],doors:['oilStore'],fov:62},
};
for(const [key,view] of Object.entries(views)){const option=document.createElement('option');option.value=key;option.textContent=view.label;selector.append(option)}
let open=false,dark=false;
function pose(){
 const v=views[selector.value],p=new Vector3(...v.p),d=new Vector3(...v.at).sub(p);
 app.camera.fov=v.fov;app.camera.updateProjectionMatrix();
 app.fly.setPose(p,Math.atan2(-d.x,-d.z),Math.atan2(d.y,Math.hypot(d.x,d.z)));app.fly.velocity.set(0,0,0);
 app.settings.timeOfDay=dark?19:12.4;
 for(const item of app.village.station.moving.doors)item.target=open&&v.doors.includes(item.name)?1:0;
 if(app.handLamp){app.handLamp.carried=dark&&!v.lampRest;app.handLamp.lit=dark;app.handLamp.glow=dark?1:0;app.handInView=false;}
 app.cameraCut(); state.textContent=`${v.label} · ${open?'open':'closed'} · ${dark?'lantern':'daylight'}`;
 door.textContent=open?'Close doors':'Open doors';night.textContent=dark?'Daylight':'Night with lantern';
}
selector.onchange=pose;door.onclick=()=>{open=!open;pose()};night.onclick=()=>{dark=!dark;pose()};
const frame=app.frame.bind(app);
app.frame=dt=>{for(const item of app.village.station.moving.doors)updateDoor(item,dt);frame(dt)};
GPU.device.addEventListener('uncapturederror',event=>{message.textContent='Render error: '+event.error.message;message.dataset.error='true';console.error(event.error)});
save.onclick=async()=>{
 save.disabled=true;app.engine.stop();let output;
 try{
  const width=1200,height=800;app.engine.canvas.width=width;app.engine.canvas.height=height;app.camera.aspect=width/height;app.camera.updateProjectionMatrix();
  output=new Texture({width,height,format:GPU.format,usage:['render','copySrc','sample'],label:'station craft review'});
  app.post.outputTexture=output;
  for(let i=0;i<32;i++){app.frame(1/60);await GPU.queue.onSubmittedWorkDone()}
  const capture=await readTexture(output),bytes=new Uint8Array(capture.data),rgba=new Uint8ClampedArray(width*height*4);
  for(let i=0;i<width*height;i++){const j=i*4;rgba[j]=bytes[j+(GPU.format.startsWith('bgra')?2:0)];rgba[j+1]=bytes[j+1];rgba[j+2]=bytes[j+(GPU.format.startsWith('bgra')?0:2)];rgba[j+3]=255}
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').putImageData(new ImageData(rgba,width,height),0,0);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png')),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=`station-${selector.value}-${open?'open':'closed'}-${dark?'night':'day'}.png`;link.click();
  setTimeout(()=>URL.revokeObjectURL(link.href),1000);
 }finally{app.post.outputTexture=null;output?.destroy();save.disabled=false;app.start()}
};
selector.disabled=door.disabled=night.disabled=save.disabled=false;
selector.value=new URLSearchParams(location.search).get('view') in views?new URLSearchParams(location.search).get('view'):'kitchen';
pose();message.textContent='Actual game geometry and materials · review only · no watch or preview saves';app.start();
</script></html>
