name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the playable night
        run: |
          node test/game-logic.mjs
          node test/flannan.mjs
          node test/demo-walk.mjs
          node test/demo-story.mjs
          node test/guidance.mjs
          node test/mobile-input.mjs
          node test/sea-weather.mjs
          node test/xr.mjs
          node test/xr-startup.mjs
          node test/xr-adapter.mjs
          node test/xr-session.mjs
          node test/xr-bridge.mjs
          node test/xr-bridge-session.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
